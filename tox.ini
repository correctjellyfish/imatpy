[gh]
python =
  3.14 = 3.14, lint
  3.13 = 3.13
  3.12 = 3.12
  3.11 = 3.11
  3.10 = 3.10


[tox]
requires =
  tox>=4
  tox-uv>=1
env_list = lint, format, 3.{10,11,12,13,14}

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
commands =
    pytest {tty:--color=yes} {posargs:tests}

# Specific python environments
[testenv:3.10]
description = "Testing python 3.10"
base_python = python3.10
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1
[testenv:3.11]
description = "Testing python 3.11"
base_python = python3.11
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1
[testenv:3.12]
description = "Testing python 3.12"
base_python = python3.12
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1
[testenv:3.13]
description = "Testing python 3.13"
base_python = python3.13
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.2.0.0
[testenv:3.14]
description = "Testing python 3.14"
base_python = python3.14
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.2.0.0

[testenv:lint]
description = run linters
skip_install = true
deps =
  ruff>=0.15.0
commands = ruff check {posargs:.}

[testenv:format]
description = run format
skip_install = true
deps =
  ruff>=0.15.0
commands = ruff format {posargs:src}

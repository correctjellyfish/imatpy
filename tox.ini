[gh]
python =
  3.12 = 3.12, lint
  3.11 = 3.11
  3.10 = 3.10
  3.9 = 3.9


[tox]
requires =
  tox>=4
  tox-uv>=1
env_list = lint, format, 3.{9,10,11,12}

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
commands =
    pytest {tty:--color=yes} {posargs:tests}

# Specific python environments

[testenv:3.9]
description = "Testing python 3.9"
base_python = python3.9
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1

[testenv:3.10]
description = "Testing python 3.10"
base_python = python3.10
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1

[testenv:3.11]
description = "Testing python 3.11"
base_python = python3.11
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1

[testenv:3.12]
description = "Testing python 3.12"
base_python = python3.12
deps =
    pytest>=6
    osqp>=1.0.3
    highspy>=1.10.0
    gurobipy>=11.0.0
    cplex>=22.1.1.1

[testenv:lint]
description = run linters
skip_install = true
deps =
  ruff>=0.15.0
commands = ruff check {posargs:imatpy}

[testenv:format]
description = run format
skip_install = true
deps =
  ruff>=0.15.0
commands = ruff format {posargs:imatpy}
